<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Viora</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <!--
      The two hosts the artwork actually waits on.

      Measured on the television: a poster from cdn.myanimelist.net takes about
      600 ms the first time and up to a second, against 150 ms from TMDB, and
      there are more of them on the home screen than from anywhere else. TMDB was
      already named here; these two were not, so every screen paid for a fresh
      name lookup, connection and handshake at the moment the artwork was wanted
      rather than before it.

      Only the first view pays it. Once an image has been seen the engine keeps
      it — measured at 1 ms to show again, against 982 ms for the same picture
      with a fresh address — so this is entirely about the first time.
    -->
    <link rel="preconnect" href="https://cdn.myanimelist.net" crossorigin />
    <link rel="preconnect" href="https://images.metahub.space" crossorigin />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://v3-cinemeta.strem.io" crossorigin />
    <link rel="preconnect" href="https://api.strem.io" crossorigin />
    <link rel="dns-prefetch" href="https://www.omdbapi.com" />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=sentient@400,500,600,700,401,501,601,701&f[]=switzer@400,500,600,700&f[]=general-sans@400,500,600,700&f[]=cabinet-grotesk@400,500,700,800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root {
        background: #0a0a0a;
        color-scheme: dark;
        margin: 0;
        height: 100%;
      }
      #viora-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        z-index: 9999;
        pointer-events: none;
        transition: opacity 280ms ease-out;
      }
      #viora-boot.gone { opacity: 0; }
      .boot-lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      /* An image now, not a drawing. Larger than the old glyph was, because the
         mark carries detail — the film perforations and the gold edge — that a
         96px square would throw away on a television seen from a sofa. */
      #viora-boot img {
        width: 168px;
        height: auto;
        filter: drop-shadow(0 10px 30px rgba(232, 170, 108, 0.22));
        animation: harborBootBeat 2600ms ease-in-out infinite;
      }
      .boot-name {
        font: 600 30px/1 "Iowan Old Style", Georgia, serif;
        letter-spacing: -0.5px;
        color: #f5f5f5;
      }
      /* Loaded from the bundle, so on first paint this falls back to a system
         script face and swaps once the app stylesheet lands. */
      .boot-sig {
        font: 400 15px/1 "WonderfulFontyCure", "Segoe Script", "Brush Script MT",
          "Lucida Handwriting", "Apple Chancery", cursive;
        color: #8a8a8a;
      }
      /* A heartbeat, not a bob: two beats close together and then a rest, the
         way a pulse actually goes. The second beat is the smaller one, and the
         long tail is what makes it read as breathing rather than throbbing. */
      @keyframes harborBootBeat {
        0%   { transform: scale(1);    opacity: 0.86; }
        8%   { transform: scale(1.07); opacity: 1; }
        16%  { transform: scale(1);    opacity: 0.92; }
        24%  { transform: scale(1.04); opacity: 1; }
        34%  { transform: scale(1);    opacity: 0.86; }
        100% { transform: scale(1);    opacity: 0.86; }
      }
    </style>
    <script>
      (function () {
        try {
          var p = new URLSearchParams(window.location.search);
          if (p.get('viora-modal') === '1') {
            var s = document.createElement('style');
            s.textContent = '#viora-boot{display:none !important}';
            document.head.appendChild(s);
          }
        } catch (e) {}

        // Fit the layout to whatever panel this is.
        //
        // A TV reports a CSS viewport of screen-width divided by density: 960px
        // on a 1080p set, which is under the 1024px breakpoint the wide layout
        // needs, so the app falls back to the compact chrome a narrow desktop
        // window would use — a side rail with no labels.
        //
        // Picking a viewport width is really a two-axis problem. Widening to a
        // fixed number fixes 16:9 and breaks everything else: on a 21:9 panel a
        // 1280px viewport is only 540px tall, far short of what the layout
        // assumes vertically. So the width is chosen as the smallest that
        // satisfies both minimums at this panel's real aspect ratio, and is
        // never smaller than what the device already reports — a 4K set is left
        // untouched rather than being scaled to someone's idea of a TV.
        // This used to run only behind `(pointer: none)`, and on a real
        // Changhong set it never ran at all — that panel claims a pointer, which
        // is the same lie platform.ts documents. The consequence was measurable
        // in a screenshot: the side rail drew 144 device pixels wide, which is
        // its 72px collapsed width at this panel's 2x density, when an applied
        // 1280px viewport would have made it 312. Every `lg:` class in the app
        // — 154 of them across 41 files — sat dead behind a 1024px breakpoint
        // that a 960px viewport can never cross, so the rail had no labels, no
        // expanded width, and a toggle that changed its own icon and nothing
        // else.
        //
        // The gate is gone rather than made cleverer. It existed to keep this
        // away from desktop and phone, and neither is built any more. The
        // `target > w` test below already leaves alone anything wide enough —
        // a 4K set, or `pnpm dev` in a 1920px browser window — so applying it
        // everywhere costs nothing and stops depending on a signal that lies.
        try {
          var DESIGN_W = 1280;
          var DESIGN_H = 720;
          var w = document.documentElement.clientWidth || window.innerWidth || 0;
          var h = document.documentElement.clientHeight || window.innerHeight || 0;
          if (w > 0 && h > 0) {
            // Width needed for the height minimum, at this aspect ratio.
            var forHeight = Math.round(DESIGN_H * (w / h));
            var target = Math.max(w, DESIGN_W, forHeight);
            if (target > w) {
              var vp = document.querySelector('meta[name="viewport"]');
              // The scale is not optional. A width on its own tells the engine
              // how wide to lay the page out but nothing about how big to draw
              // it, and Android WebView's answer is 1:1 — so a 1280px layout in
              // a 960px window simply had its right and bottom quarter hanging
              // outside the screen. Stating the ratio makes the whole layout
              // land exactly on the panel, which is the entire point of
              // choosing a width in the first place.
              var scale = w / target;
              if (vp) vp.setAttribute('content', 'width=' + target + ', initial-scale=' + scale);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="viora-boot">
      <div class="boot-lockup">
        <!-- The owner's own mark, and the only image on the boot screen.
             It is in `public/`, so it is served at this path from the very
             first frame without waiting for the bundle — which is the point of
             this screen. The name and the signature sit beneath it. -->
        <img src="/viora-mark.png" alt="" aria-hidden="true" draggable="false" />
        <div class="boot-name">Viora</div>
        <div class="boot-sig">zayo0ni</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
