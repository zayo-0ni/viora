name: Android

# Builds an APK on every push to main, as a check that the tree compiles on a
# clean machine. Linux runners have no symlink restriction, so the official
# `tauri android build` works here — the local build-apk.mjs workaround is only
# needed on Windows hosts.
#
# It publishes nothing. Releases are made by hand with نشر_الإصدار.bat; see the
# note on the removed publish step at the foot of this file.
#
# `tags: ["v*"]` is deliberately absent. A release tag would only start a build
# whose output goes nowhere, sixteen minutes after the release it cannot join.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Build a release APK instead of debug"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Read-only. This was `contents: write`, which the removed publish step
    # needed to attach assets to a release. Nothing here writes to the
    # repository any more, and a token that can publish is a token that can
    # publish by accident.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # Keyed on the lockfile so a dependency bump busts it, and on the OS so a
      # runner image change does not resurrect stale artefacts.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and build the web bundle
        run: pnpm run build

      # Release APKs must be signed or Android refuses to install them. Without
      # the secrets the Gradle config falls back to the debug key, which is
      # still installable — just not suitable for distribution.
      - name: Write the signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "no keystore secret — release builds will use the debug key"
            exit 0
          fi
          dir=src-tauri/gen/android
          echo "$KEYSTORE" | base64 -d > "$dir/viora-release.jks"
          # Written rather than interpolated inline so the password never lands
          # in the step's echoed command line.
          {
            echo "storeFile=viora-release.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$STORE_PASS"
          } > "$dir/keystore.properties"
          echo "keystore configured"

      # arm64 plus armv7: plenty of cheap TV boxes and older Fire TV sticks are
      # still 32-bit, and an arm64-only APK simply refuses to install there with
      # no explanation beyond "App not installed". x86 is skipped — no shipping
      # Android TV runs it.
      - name: Build the APK
        run: |
          if [ "${{ github.ref_type == 'tag' || inputs.release }}" = "true" ]; then
            pnpm exec tauri android build --target aarch64 armv7 --apk
          else
            pnpm exec tauri android build --debug --target aarch64 armv7 --apk
          fi

      - name: Locate the APK
        id: apk
        run: |
          # Two targets produce a universal APK carrying both ABIs; prefer it
          # over the per-ABI splits sitting in the same tree.
          path=$(find src-tauri/gen/android/app/build/outputs/apk -name '*universal*.apk' | head -1)
          [ -n "$path" ] || path=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          [ -n "$path" ] || { echo "no APK produced"; exit 1; }
          versioned="Viora-${{ steps.meta.outputs.version }}-android.apk"
          cp "$path" "$versioned"
          # The version-less copy is what makes /releases/latest/download/ work:
          # that path needs a filename that never changes, so a TV configured
          # once keeps fetching the newest build forever.
          cp "$path" "Viora-android.apk"
          # Alias kept so any address already written down keeps resolving, even
          # though the file is no longer arm64-only.
          cp "$path" "Viora-arm64.apk"
          echo "path=$versioned" >> "$GITHUB_OUTPUT"
          ls -lh "$versioned" "Viora-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: viora-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # Releases are published by hand, from نشر_الإصدار.bat, and by the owner
      # only. There used to be a softprops/action-gh-release step here that
      # attached APKs whenever a v* tag landed.
      #
      # It had to go because `gh release create` creates the tag, so publishing
      # locally woke this workflow and the two of them wrote to the same release
      # at once. On v1.0.3 that cost the arm64 asset outright: the local upload
      # of 180 MB was still in flight when the runner finished and attached its
      # own build under the same name, and what survived was one file out of
      # four. The address in README points at Viora-android.apk, so the release
      # was left un-installable for every arm64 viewer.
      #
      # The build above still runs, as a check that the tree compiles on a clean
      # machine. It attaches its APK to the workflow run, where only the repo
      # can reach it, and publishes nothing.
