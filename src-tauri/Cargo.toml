[package]
name = "viora"
version = "1.0.4"
description = "A Stremio client built for adventure"
edition = "2021"

[lib]
name = "viora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ---------------------------------------------------------------------------
# Shared across every target.
# ---------------------------------------------------------------------------
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-process = "2"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
# TLS backend is target-dependent (see the per-target blocks below): OpenSSL
# does not cross-compile cleanly to the mobile NDK/SDK toolchains.
reqwest = { version = "0.12", default-features = false, features = ["stream", "multipart", "json", "gzip"] }
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
libc = "0.2"
base64 = "0.22"
png = "0.17"
hound = "3.5"
rust_cast = { path = "vendor/rust_cast", version = "0.20" }
mdns-sd = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
viora-core = { path = "../viora-core" }
librqbit = { version = "=8.1.1", default-features = false, features = ["rust-tls"] }
url = "2"
realfft = "3"

# ---------------------------------------------------------------------------
# Android. libmpv, the tray, the updater, single-instance, Discord IPC, the
# Windows and macOS window bindings and gtk were the other half of this file;
# they went with the desktop target.
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "android")'.dependencies]
# OpenSSL does not cross-compile cleanly to the NDK toolchain; rustls does.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.dev]
debug = "line-tables-only"

# Cargo's release defaults keep full debug symbols, and those are most of the
# APK: the unstripped library runs ~150 MB per ABI, which is why shipping two
# architectures produced a 296 MB download. Stripping and optimising for size
# changes no behaviour.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

